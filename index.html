<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Timeline — Promo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f14;
    --surface: #16171f;
    --surface2: #1e2030;
    --border: #2a2d3e;
    --positive: #6de8a0;
    --positive-glow: rgba(109,232,160,0.45);
    --negative: #e86d6d;
    --text: #e8e6e0;
    --text-muted: #7a7a8c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ── SCENE WRAPPER ── */
  #scene {
    width: 900px;
    height: 540px;
    background: var(--bg);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
    position: relative;
    box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
  }

  /* ── FAKE APP UI ── */
  .app-header {
    padding: 18px 36px 14px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .app-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 400;
  }
  .app-subtitle {
    font-size: 11px; color: var(--text-muted);
    letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3px;
  }
  .add-btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 18px; border-radius: 100px;
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
    display: flex; align-items: center; gap: 7px; cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .add-btn.hovered {
    background: var(--border); border-color: var(--text-muted);
    box-shadow: 0 0 18px rgba(109,232,160,0.15);
  }

  /* ── CANVAS AREA ── */
  .app-canvas {
    position: relative;
    width: 100%;
    height: calc(540px - 72px);
    overflow: hidden;
  }
  canvas#wave {
    position: absolute; top: 0; left: 0;
    pointer-events: none;
  }

  /* ── EVENT ORB ── */
  .event-label {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translateX(-50%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  .event-label.visible { opacity: 1; }
  .event-text { text-align: center; margin-bottom: 6px; }
  .event-title-el {
    font-family: 'Playfair Display', serif;
    font-size: 13px; font-weight: 400; color: var(--text);
    white-space: nowrap;
  }
  .event-desc-el {
    font-size: 10px; color: var(--text-muted); margin-top: 2px;
    white-space: nowrap;
  }
  .connector {
    width: 1px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.0), rgba(255,255,255,0.2));
    flex-shrink: 0;
  }
  .orb {
    width: 48px; height: 48px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(160,255,200,0.45), rgba(109,232,160,0.2) 60%, transparent);
    border: 1.5px solid rgba(109,232,160,0.5);
    box-shadow: 0 0 22px rgba(109,232,160,0.22);
    position: relative;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: filter 0.2s, box-shadow 0.3s;
  }
  .orb.pulsing {
    animation: orbPulse 1.4s ease-in-out infinite;
    box-shadow: 0 0 38px rgba(109,232,160,0.55);
  }
  @keyframes orbPulse {
    0%, 100% { box-shadow: 0 0 22px rgba(109,232,160,0.25); }
    50% { box-shadow: 0 0 48px rgba(109,232,160,0.65); }
  }
  .play-btn {
    width: 22px; height: 22px;
    background: rgba(109,232,160,0.9); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.6s;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    box-shadow: 0 0 10px rgba(109,232,160,0.5);
  }
  .play-btn.visible { opacity: 1; }
  .play-btn svg { margin-left: 2px; }

  /* ── MODAL ── */
  #modalOverlay {
    position: absolute; inset: 0;
    background: rgba(14,15,20,0.75);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s;
    z-index: 50;
  }
  #modalOverlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 28px 24px;
    width: 340px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6);
  }
  .modal h2 {
    font-family: 'Playfair Display', serif;
    font-size: 18px; font-weight: 400; margin-bottom: 20px;
  }
  .form-row { margin-bottom: 14px; }
  .form-label {
    font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 5px; display: block;
  }
  .form-input {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px;
    color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 13px; outline: none;
    transition: border-color 0.2s;
  }
  .form-input.focused {
    border-color: rgba(109,232,160,0.4);
    box-shadow: 0 0 0 3px rgba(109,232,160,0.08);
  }
  .type-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .type-btn {
    flex: 1; padding: 8px; border-radius: 8px; cursor: pointer;
    font-size: 12px; font-weight: 500; text-align: center;
    border: 1px solid var(--border); background: var(--surface2);
    color: var(--text-muted); transition: all 0.2s;
  }
  .type-btn.active-pos {
    border-color: rgba(109,232,160,0.4); background: rgba(109,232,160,0.08);
    color: var(--positive);
  }
  .save-btn {
    width: 100%; padding: 11px;
    background: rgba(109,232,160,0.12);
    border: 1px solid rgba(109,232,160,0.3);
    border-radius: 100px; color: var(--positive);
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; margin-top: 4px;
    transition: all 0.2s;
  }
  .save-btn.hovered {
    background: rgba(109,232,160,0.22);
    box-shadow: 0 0 20px rgba(109,232,160,0.2);
  }

  /* ── VOICEOVER CAPTION BOX ── */
  #caption {
    position: absolute;
    bottom: 28px; left: 50%;
    transform: translateX(-50%);
    background: rgba(14,15,20,0.88);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border-radius: 100px;
    padding: 10px 24px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 14px;
    color: rgba(232,230,224,0.92);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 200;
    pointer-events: none;
    max-width: 820px;
    white-space: normal;
    text-align: center;
    line-height: 1.5;
  }
  #caption.visible { opacity: 1; }

  /* ── CURSOR ── */
  #cursor {
    position: absolute;
    width: 18px; height: 18px;
    pointer-events: none;
    z-index: 999;
    transition: transform 0.1s;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }
  #cursor.clicking { transform: scale(0.82); }

  /* ── RIPPLE ── */
  .ripple {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(109,232,160,0.6);
    width: 10px; height: 10px;
    pointer-events: none;
    animation: rippleOut 0.5s ease-out forwards;
    z-index: 900;
  }
  @keyframes rippleOut {
    from { width: 10px; height: 10px; opacity: 0.8; margin: -5px 0 0 -5px; }
    to   { width: 50px; height: 50px; opacity: 0; margin: -25px 0 0 -25px; }
  }

  /* ── TYPING CURSOR ── */
  .type-cursor {
    display: inline-block;
    width: 1px; height: 13px;
    background: var(--positive);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 0.7s steps(1) infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── WAVE GLOW OVERLAY ── */
  #waveGlow {
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s;
    z-index: 1;
  }
  #waveGlow.visible { opacity: 1; }

  /* ── INTRO / REPLAY ── */
  #replayBtn {
    position: absolute;
    bottom: 20px; right: 24px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-muted); font-family: 'DM Sans', sans-serif;
    font-size: 11px; padding: 6px 14px; border-radius: 100px;
    cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity 0.4s;
    z-index: 300;
  }
  #replayBtn.visible { opacity: 1; pointer-events: all; }
  #replayBtn:hover { color: var(--text); border-color: var(--text-muted); }

  /* ── OUTER WRAPPER BG ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(109,232,160,0.04) 0%, transparent 70%);
    pointer-events: none;
  }

  .screen-label {
    font-size: 11px; color: var(--text-muted); letter-spacing: 0.12em;
    text-transform: uppercase; margin-bottom: 14px;
    text-align: center;
  }
</style>
</head>
<body>

<p class="screen-label">life timeline · promo demo · press play to watch</p>

<div id="scene">
  <!-- App Header -->
  <div class="app-header">
    <div>
      <div class="app-title">Life Timeline</div>
      <div class="app-subtitle">Your story, mapped in moments</div>
    </div>
    <button class="add-btn" id="addBtn">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Add Experience
    </button>
  </div>

  <!-- Canvas -->
  <div class="app-canvas" id="appCanvas">
    <canvas id="wave"></canvas>

    <!-- Event label: text above, connector, orb ON the line -->
    <div class="event-label" id="eventLabel" style="left:450px;">
      <div class="event-text">
        <div class="event-title-el">Built Life Timeline on Claude</div>
        <div class="event-desc-el">An idea that became real in one afternoon</div>
      </div>
      <div class="connector" id="connector" style="height:32px;"></div>
      <div class="orb" id="orb">
        <div class="play-btn" id="playBtn">
          <svg width="8" height="9" viewBox="0 0 8 9" fill="white"><path d="M1 1l6 3.5L1 8V1z"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modalOverlay">
    <div class="modal">
      <h2>New Experience</h2>
      <div class="form-row">
        <label class="form-label">Title</label>
        <input class="form-input" id="inputTitle" placeholder="Name this moment…" readonly>
      </div>
      <div class="form-row">
        <label class="form-label">Description</label>
        <input class="form-input" id="inputDesc" placeholder="A little detail…" readonly>
      </div>
      <div class="form-row" style="display:flex;gap:8px;">
        <div style="flex:1">
          <label class="form-label">Year</label>
          <input class="form-input" id="inputYear" value="2026" readonly>
        </div>
        <div style="flex:1">
          <label class="form-label">Month</label>
          <input class="form-input" id="inputMonth" value="March" readonly>
        </div>
      </div>
      <div class="type-row">
        <div class="type-btn active-pos">✦ Positive</div>
        <div class="type-btn">✦ Negative</div>
      </div>
      <button class="save-btn" id="saveBtn">Save Experience</button>
    </div>
  </div>

  <!-- Caption -->
  <div id="caption"></div>

  <!-- Cursor -->
  <svg id="cursor" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 2L8 16L10.5 10.5L16 8L2 2Z" fill="white" stroke="rgba(0,0,0,0.5)" stroke-width="0.8"/>
  </svg>

  <!-- Replay -->
  <button id="replayBtn" onclick="startDemo()">↺ Replay</button>
</div>

<script>
const scene = document.getElementById('scene');
const cursor = document.getElementById('cursor');
const modal = document.getElementById('modalOverlay');
const caption = document.getElementById('caption');
const addBtn = document.getElementById('addBtn');
const saveBtn = document.getElementById('saveBtn');
const titleInput = document.getElementById('inputTitle');
const descInput = document.getElementById('inputDesc');
const eventLabel = document.getElementById('eventLabel');
const orb = document.getElementById('orb');
const playBtn = document.getElementById('playBtn');
const waveCanvas = document.getElementById('wave');
const appCanvas = document.getElementById('appCanvas');
const replayBtn = document.getElementById('replayBtn');
const connector = document.getElementById('connector');

let cx = 120, cy = 80; // cursor start
let animFrame;

// ── Helpers ──
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function setCursor(x, y) {
  cursor.style.left = x + 'px';
  cursor.style.top  = y + 'px';
}

function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

async function moveTo(tx, ty, dur = 600) {
  const sx = cx, sy = cy;
  const start = performance.now();
  return new Promise(resolve => {
    function step(now) {
      let t = Math.min(1, (now - start) / dur);
      t = easeInOut(t);
      cx = sx + (tx - sx) * t;
      cy = sy + (ty - sy) * t;
      setCursor(cx, cy);
      if (t < 1) requestAnimationFrame(step);
      else resolve();
    }
    requestAnimationFrame(step);
  });
}

function spawnRipple(x, y) {
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = x + 'px';
  r.style.top  = y + 'px';
  scene.appendChild(r);
  setTimeout(() => r.remove(), 600);
}

async function click(x, y) {
  await moveTo(x, y, 300);
  cursor.classList.add('clicking');
  spawnRipple(x, y);
  await sleep(150);
  cursor.classList.remove('clicking');
  await sleep(80);
}

async function typeInto(el, text, speed = 55) {
  el.classList.add('focused');
  el.value = '';
  for (let i = 0; i < text.length; i++) {
    el.value += text[i];
    await sleep(speed + Math.random() * 30);
  }
  el.classList.remove('focused');
}

function showCaption(text, dur = 3800) {
  caption.textContent = text;
  caption.classList.add('visible');
  return sleep(dur);
}
function hideCaption() {
  caption.classList.remove('visible');
  return sleep(600);
}

// ── Constants ──
const N = 300; // number of points in the line (shared across phases)

// Secondary orbs — positions match waveform peaks/valleys. isMain = "Built Life Timeline"
const TIMELINE_EVENTS = [
  { nx: 0.15, type: 'negative', size: 30 },  // first valley
  { nx: 0.38, type: 'positive', size: 24 },  // small positive peak
  { nx: 0.50, type: 'positive', size: 44, isMain: true }, // main peak
  { nx: 0.62, type: 'negative', size: 34 },  // deep valley
  { nx: 0.72, type: 'negative', size: 24 },  // second valley
  { nx: 0.82, type: 'positive', size: 30 },  // first of double peak
  { nx: 0.90, type: 'positive', size: 34 },  // second of double peak
];

// ── Bell curve (phase 1): gaussian centred at nx=0.50, peak normY ──
const BELL_PEAK_NX = 0.50;
const BELL_SIGMA   = 0.18;
function bellY(nx) {
  // 0 = bottom of canvas region, 1 = top; mid = 0.5
  const gauss = Math.exp(-Math.pow((nx - BELL_PEAK_NX) / BELL_SIGMA, 2));
  return 0.38 + gauss * 0.44; // baseline 0.38, peak 0.82
}

// ── Full life arc (phase 2): Catmull-Rom through control points ──
// Mapped to match the screenshot waveform precisely
const LIFE_CTRL = [
  [0.00, 0.50],  // start mid
  [0.05, 0.48],
  [0.10, 0.40],  // descending toward first valley
  [0.15, 0.28],  // valley — red orb
  [0.20, 0.38],
  [0.28, 0.50],  // recovering
  [0.34, 0.58],
  [0.38, 0.62],  // small positive peak — green orb
  [0.43, 0.68],  // rising toward main peak
  [0.50, 0.80],  // main peak — big green orb (bell peak matches)
  [0.57, 0.66],  // descending
  [0.62, 0.30],  // deep valley — red orb
  [0.67, 0.40],
  [0.72, 0.32],  // second valley — red orb
  [0.77, 0.50],
  [0.82, 0.70],  // first of double peak — green orb
  [0.87, 0.68],
  [0.90, 0.72],  // second of double peak — green orb
  [0.95, 0.66],
  [1.00, 0.64],  // tails off right
];
function catmullY(nx) {
  const pts = LIFE_CTRL;
  let i = 1;
  while (i < pts.length - 2 && pts[i][0] < nx) i++;
  const p0 = pts[Math.max(0, i-2)];
  const p1 = pts[i-1];
  const p2 = pts[i];
  const p3 = pts[Math.min(pts.length-1, i+1)];
  const span = p2[0] - p1[0];
  if (span <= 0) return p1[1];
  const t  = (nx - p1[0]) / span;
  const t2 = t*t, t3 = t2*t;
  return 0.5*(
    2*p1[1] +
    (-p0[1]+p2[1])*t +
    (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 +
    (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3
  );
}

// ── Build a Y-array of N evenly-spaced points for a given shape function ──
function buildYArray(shapeFn) {
  const arr = new Float32Array(N);
  for (let i = 0; i < N; i++) arr[i] = shapeFn(i / (N-1));
  return arr;
}

// ── Lerp between two Y-arrays ──
function lerpYArrays(a, b, t) {
  const out = new Float32Array(N);
  for (let i = 0; i < N; i++) out[i] = a[i] + (b[i]-a[i])*t;
  return out;
}

// ── Render a Y-array to canvas as a smooth white line ──
function renderLine(ctx, W, H, yArr, drawUpTo = N-1) {
  const mid = H * 0.50;
  const amp = H * 0.38;
  ctx.clearRect(0, 0, W, H);

  // Build point list
  const count = Math.min(drawUpTo+1, N);
  const pts = [];
  for (let i = 0; i < count; i++) {
    const nx = i / (N-1);
    pts.push([nx*W, mid - (yArr[i]-0.5)*amp]);
  }
  if (pts.length < 2) return pts;

  // Subtle fill
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(255,255,255,0.04)');
  grad.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.moveTo(pts[0][0], H);
  for (const p of pts) ctx.lineTo(p[0],p[1]);
  ctx.lineTo(pts[pts.length-1][0], H);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Smooth bezier line
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length-1; i++) {
    const mx = (pts[i][0]+pts[i+1][0])/2;
    const my = (pts[i][1]+pts[i+1][1])/2;
    ctx.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);
  }
  ctx.lineTo(pts[pts.length-1][0],pts[pts.length-1][1]);
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth   = 1.8;
  ctx.lineJoin    = 'round';
  ctx.lineCap     = 'round';
  ctx.stroke();

  return pts;
}

// ── Position the main event-label so orb centre sits exactly on the line ──
function positionMainOrb(W, H, yArr) {
  const mid  = H * 0.50;
  const amp  = H * 0.38;
  const ev   = TIMELINE_EVENTS.find(e => e.isMain);
  const idx  = Math.round(ev.nx * (N-1));
  const lineY = mid - (yArr[idx] - 0.5) * amp;
  // event-label flex column: [text][connector][orb]
  // orb is 48px tall. We want orb centre = lineY.
  // So orb top = lineY - 24. The full label top = lineY - 24 - connectorH - textH
  // Use getBoundingClientRect for text height, or just fix it
  const connH = 32; // matches style="height:32px"
  const textH = 46; // approx: title ~20px + desc ~16px + margin ~10px
  const labelTop = lineY - 24 - connH - textH;
  eventLabel.style.left = (ev.nx * W) + 'px';
  eventLabel.style.top  = labelTop + 'px';
}

// ── Spawn a secondary orb DOM element ──
function spawnTimelineOrb(ev, x, y) {
  const isPos = ev.type === 'positive';
  const color = isPos ? '109,232,160' : '232,109,109';
  const s = ev.size;
  const el = document.createElement('div');
  el.className = 'tl-orb';
  el.style.cssText = `
    position:absolute;
    width:${s}px;height:${s}px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,rgba(${color},0.55),rgba(${color},0.18) 60%,transparent);
    border:1.5px solid rgba(${color},0.6);
    box-shadow:0 0 ${s*0.7}px rgba(${color},0.35);
    left:${x-s/2}px;top:${y-s/2}px;
    pointer-events:none;opacity:0;
    transition:opacity 0.6s ease;z-index:20;
  `;
  appCanvas.appendChild(el);
  requestAnimationFrame(() => { el.style.opacity='1'; });
  return el;
}

let spawnedOrbs = [];
function clearTimelineOrbs() {
  spawnedOrbs.forEach(el => el.remove());
  spawnedOrbs = [];
}

// Cached shape arrays (built once)
const yBell = buildYArray(bellY);
const yLife = buildYArray(catmullY);

// Current rendered Y state (mutable, used for morph)
let yCurrent = new Float32Array(yBell);

// ── PHASE 1: Animate the bell curve drawing left→right ──
let waveProgress = 0;
async function animateWave() {
  waveProgress = 0;
  yCurrent = new Float32Array(yBell);
  const W = appCanvas.offsetWidth, H = appCanvas.offsetHeight;
  waveCanvas.width = W; waveCanvas.height = H;
  return new Promise(resolve => {
    const start = performance.now(), dur = 1800;
    function step(now) {
      const t = Math.min(1, (now-start)/dur);
      const eased = easeInOut(t);
      waveProgress = eased;
      const drawUpTo = Math.floor(eased*(N-1));
      const ctx = waveCanvas.getContext('2d');
      renderLine(ctx, W, H, yBell, drawUpTo);
      // Leading dot
      if (t < 1) {
        const mid=H*0.50, amp=H*0.38;
        const nx = drawUpTo/(N-1);
        const lx = nx*W, ly = mid-(yBell[drawUpTo]-0.5)*amp;
        ctx.beginPath(); ctx.arc(lx,ly,3,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fill();
      }
      if (t<1) requestAnimationFrame(step); else resolve();
    }
    requestAnimationFrame(step);
  });
}

// ── PHASE 2: Morph the bell into the full life arc, spawning orbs ──
async function animateFullTimeline() {
  TIMELINE_EVENTS.forEach(ev => { if (!ev.isMain) ev._spawned = false; });
  const W = appCanvas.offsetWidth, H = appCanvas.offsetHeight;
  const mid = H*0.50, amp = H*0.38;
  return new Promise(resolve => {
    const start = performance.now(), dur = 5000;
    function step(now) {
      const t = Math.min(1, (now-start)/dur);
      const eased = easeInOut(t);
      yCurrent = lerpYArrays(yBell, yLife, eased);
      waveCanvas.width = W; waveCanvas.height = H;
      const ctx = waveCanvas.getContext('2d');
      renderLine(ctx, W, H, yCurrent, N-1);

      // Keep main orb pinned to its point on the morphing line
      positionMainOrb(W, H, yCurrent);

      // Reposition already-spawned secondary orbs
      spawnedOrbs.forEach(el => {
        const ev2 = TIMELINE_EVENTS.find(e => !e.isMain && el._evNx === e.nx);
        if (!ev2) return;
        const idx2 = Math.round(ev2.nx*(N-1));
        const ly2  = mid-(yCurrent[idx2]-0.5)*amp;
        el.style.top = (ly2 - ev2.size/2)+'px';
      });

      // Spawn new orbs as morph reveals them (stagger by nx threshold)
      const revealThreshold = eased;
      TIMELINE_EVENTS.forEach(ev => {
        if (ev.isMain) return;
        // reveal orbs progressively as morph progresses past their nx
        if (ev.nx <= revealThreshold * 1.1 && !ev._spawned) {
          ev._spawned = true;
          const idx = Math.round(ev.nx*(N-1));
          const x   = ev.nx*W;
          const y   = mid-(yCurrent[idx]-0.5)*amp;
          const el  = spawnTimelineOrb(ev, x, y);
          el._evNx  = ev.nx;
          spawnedOrbs.push(el);
        }
      });

      if (t<1) requestAnimationFrame(step); else resolve();
    }
    requestAnimationFrame(step);
  });
}

// ── Main Demo Sequence ──
async function startDemo() {

  modal.classList.remove('open');
  eventLabel.classList.remove('visible');

  orb.classList.remove('pulsing');
  orb.style.filter = '';
  playBtn.classList.remove('visible');
  caption.classList.remove('visible');
  caption.textContent = '';
  addBtn.classList.remove('hovered');
  saveBtn.classList.remove('hovered');
  titleInput.value = '';
  descInput.value = '';
  clearTimelineOrbs();
  TIMELINE_EVENTS.forEach(ev => { ev._spawned = false; });
  // Clear canvas completely
  const W0 = appCanvas.offsetWidth, H0 = appCanvas.offsetHeight;
  waveCanvas.width = W0; waveCanvas.height = H0;
  waveCanvas.getContext('2d').clearRect(0, 0, W0, H0);
  cx = 120; cy = 80;
  setCursor(cx, cy);
  cursor.style.opacity = '0';
  await sleep(800);
  cursor.style.opacity = '1';

  // ── SCENE 1: Opening caption ──
  await showCaption('Once upon a time, someone wanted to remember their life…', 3000);
  await hideCaption();

  // ── SCENE 2: Hover Add Experience ──
  const addRect = addBtn.getBoundingClientRect();
  const sceneRect = scene.getBoundingClientRect();
  const addX = addRect.left - sceneRect.left + addRect.width / 2;
  const addY = addRect.top  - sceneRect.top  + addRect.height / 2;

  await moveTo(addX, addY - 60, 700);
  await moveTo(addX, addY, 500);
  addBtn.classList.add('hovered');
  await sleep(400);
  await showCaption('They clicked "Add Experience"…', 1600);
  await hideCaption();

  // Click
  await click(addX, addY);
  addBtn.classList.remove('hovered');
  modal.classList.add('open');
  await sleep(500);

  // ── SCENE 3: Type title ──
  const titleRect = titleInput.getBoundingClientRect();
  const titleX = titleRect.left - sceneRect.left + 30;
  const titleY = titleRect.top  - sceneRect.top  + titleRect.height / 2;
  await moveTo(titleX, titleY, 500);
  await click(titleX, titleY);
  await showCaption("And typed the moment they'd never forget\u2026", 2000);
  await hideCaption();
  await typeInto(titleInput, 'Built Life Timeline on Claude', 52);
  await sleep(300);

  // Type description
  const descRect = descInput.getBoundingClientRect();
  const descX = descRect.left - sceneRect.left + 30;
  const descY = descRect.top  - sceneRect.top  + descRect.height / 2;
  await moveTo(descX, descY, 400);
  await click(descX, descY);
  await typeInto(descInput, 'An idea that became real in one afternoon', 44);
  await sleep(500);

  // ── SCENE 4: Save ──
  const saveBtnRect = saveBtn.getBoundingClientRect();
  const saveX = saveBtnRect.left - sceneRect.left + saveBtnRect.width / 2;
  const saveY = saveBtnRect.top  - sceneRect.top  + saveBtnRect.height / 2;
  await moveTo(saveX, saveY, 600);
  saveBtn.classList.add('hovered');
  await sleep(300);
  await showCaption('They saved it. And the timeline began to draw itself…', 2400);
  await hideCaption();
  await click(saveX, saveY);
  saveBtn.classList.remove('hovered');
  modal.classList.remove('open');
  await sleep(200);

  // ── SCENE 5: Wave draws as bell curve ──
  await animateWave();
  await sleep(300);
  // Draw final bell, position orb on it
  const W5 = appCanvas.offsetWidth, H5 = appCanvas.offsetHeight;
  waveCanvas.width = W5; waveCanvas.height = H5;
  renderLine(waveCanvas.getContext('2d'), W5, H5, yBell, N-1);
  positionMainOrb(W5, H5, yBell);
  eventLabel.style.opacity = '0';
  eventLabel.classList.add('visible');
  let op = 0;
  await new Promise(r => {
    const iv = setInterval(() => {
      op = Math.min(1, op + 0.07);
      eventLabel.style.opacity = op;
      if (op >= 1) { clearInterval(iv); r(); }
    }, 30);
  });

  await sleep(400);
  await showCaption('There it was. A glowing orb on the curve of their life.', 3000);
  await hideCaption();

  // Play button appears
  playBtn.classList.add('visible');
  orb.classList.add('pulsing');
  await sleep(600);

  // ── SCENE 6: Click orb ──
  // Re-read orb position after it's been placed on the bell peak
  await sleep(100); // let layout settle
  const orbRect = orb.getBoundingClientRect();
  const orbX = orbRect.left - sceneRect.left + orbRect.width / 2;
  const orbY = orbRect.top  - sceneRect.top  + orbRect.height / 2;

  await showCaption('The little play button winked at them…', 2000);
  await hideCaption();
  await moveTo(orbX, orbY, 700);

  await click(orbX, orbY);
  orb.classList.remove('pulsing');
  orb.style.filter = 'brightness(1.6)';
  spawnRipple(orbX, orbY);
  spawnRipple(orbX, orbY);
  await sleep(200);
  orb.style.filter = '';
  orb.classList.add('pulsing');

  // ── SCENE 7: Voiceover + full life arc animation ──
  await sleep(300);
  await showCaption('"I built this app on Claude — just me and an idea, talking it into existence."', 3800);
  await hideCaption();

  await sleep(200);

  // Caption 2 starts, wave begins drawing the full arc simultaneously
  caption.textContent = '"I mapped every moment that shaped me…"';
  caption.classList.add('visible');

  const wavePromise = animateFullTimeline();
  await sleep(3800);
  await hideCaption();
  await sleep(300);

  // Caption 3 — the tough section
  await showCaption('"The highs. The hard years that almost broke me."', 3400);
  await hideCaption();
  await sleep(200);

  await wavePromise;

  // Caption 4 — the turning points
  await showCaption('"The turning points. The quiet moments of survival."', 3400);
  await hideCaption();
  await sleep(200);

  // Caption 5
  await showCaption('"Each bubble holds a memory. Click it, and it speaks."', 3200);
  await hideCaption();
  await sleep(300);

  await showCaption('"This is my life, drawn as a wave. And it\u2019s still being written."', 3800);
  await hideCaption();

  // ── SCENE 8: End card ──
  await sleep(400);
  await showCaption('Life Timeline — built on Claude ✦', 4000);

  replayBtn.classList.add('visible');
}

// ── Start on load ──
window.addEventListener('load', () => {
  const W = appCanvas.offsetWidth, H = appCanvas.offsetHeight;
  waveCanvas.width = W; waveCanvas.height = H;
  waveCanvas.getContext('2d').clearRect(0,0,W,H);
  setTimeout(startDemo, 600);
});
